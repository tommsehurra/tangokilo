name = "tangokilo"
compatibility_date = "2026-08-28"
# Worker nur fuer /api/* (Flight-Weather-Proxy). Alle anderen Anfragen liefern
# weiterhin direkt die statischen Dateien aus — ohne den Worker aufzurufen.
main = "wx_worker.js"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]
