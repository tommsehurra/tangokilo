name: CI

# Verifies the Tango Kilo site + SatMap widget on every push / PR so a broken change
# is caught before it reaches Cloudflare Pages / the radio. All test execution is
# network-free: no CDN (Cesium / Leaflet / Three) is loaded — the tests stub the
# EdgeTX API, decode synthetic (coordinate-free) logs, and syntax-check inline JS.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Run CI checks (luac + EdgeTX harness + node --check + decoder tests)
        run: bash test/run_ci.sh
