name: Galerie-Manifest

# Laeuft automatisch, wenn du Bilder in images/ hochlaedst (oder loeschst),
# und schreibt images/manifest.json. Die Website liest nur diese Datei —
# damit kein GitHub-API-Limit fuer Besucher. Das Manifest selbst loest den
# Lauf NICHT erneut aus (unten ausgeschlossen), also keine Endlosschleife.

on:
  push:
    paths:
      - 'images/**'
      - '!images/manifest.json'
  workflow_dispatch:        # erlaubt manuelles Ausloesen im Actions-Tab

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest erzeugen
        run: |
          mkdir -p images
          python3 - <<'PY'
          import os, re, json
          d = "images"
          rx = re.compile(r'\.(jpe?g|png|gif|webp|avif|bmp|svg)$', re.I)
          files = sorted(
              f for f in os.listdir(d)
              if os.path.isfile(os.path.join(d, f)) and rx.search(f)
          )
          with open(os.path.join(d, "manifest.json"), "w", encoding="utf-8") as fh:
              json.dump(files, fh, ensure_ascii=False)
          print(f"{len(files)} Bild(er) im Manifest:", files)
          PY

      - name: Aenderung committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/manifest.json
          git diff --cached --quiet || (git commit -m "Galerie-Manifest aktualisiert" && git push)
